[project]
name = "skn35-final-3team"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # db: PostgreSQL 16 + pgvector. 비동기 ORM(SQLAlchemy) · 드라이버 asyncpg · 마이그레이션 alembic
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
