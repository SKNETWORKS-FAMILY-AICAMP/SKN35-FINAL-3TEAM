# 예약 실행 (유즈케이스의 "예약 실행" 액터). 평일(월~금) 한국 시간에 돈다.
# 서버 .env 의 SCHEDULER_ENABLED=true 일 때만 시각에 맞춰 돈다. 관리자는 화면(예약 작업)에서 언제든 "지금 실행" 할 수 있다.
# 사람마다 실행할 때는 그 사람의 권한으로 검사·감사 기록을 거친다 (서비스 계정이 남의 권한을 빌리지 않는다).
timezone: Asia/Seoul
jobs:
  - id: market_collect          # UC-02-1 시장 데이터 수집·적재 (시장 MCP 가 한다. MCP 에 DATABASE_URL 필요)
    name: 시장 데이터 수집
    at: "09:10"
    days: 10                    # 오늘부터 며칠 전까지 받을지
  - id: market_report           # UC-02 금리·환율 리포트 (사람마다 한 건, 내 문서에 저장)
    name: 금리·환율 리포트
    at: "09:20"
    users: [E1001, E2001]       # 받을 직원 (사번)
  - id: maturity_alert          # UC-03 대출 만기 알림 (대출 담당자마다 알림함으로)
    name: 대출 만기 알림
    at: "09:30"
    days: 30
