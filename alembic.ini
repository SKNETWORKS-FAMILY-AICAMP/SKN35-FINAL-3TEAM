# Alembic config (DB schema migrations). See alembic/README.md.
# Keep this file ASCII-only: Windows reads it with the locale codec (cp949).
# The DB URL is not set here: alembic/env.py reads DATABASE_URL from .env.

[alembic]
script_location = %(here)s/alembic
path_separator = os
# Revision files are numbered by hand: alembic revision --rev-id 0003 -m "..."
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
