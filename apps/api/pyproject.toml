[project]
name = "agent-platform"
version = "0.1.0"
description = "규제 산업용 사내 설치형 AI 에이전트 플랫폼 — API 서버"
requires-python = ">=3.12"
dependencies = [
    # knowledge/ingestion: 문서 판별(router)·파싱. Docling 내부 함수(text_quality, docling-parse 백엔드)를 쓰므로 버전 고정.
    # docling-parse·olefile은 docling과 함께 설치된다.
    "docling==2.150.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
