# 커넥터 매니페스트 — 하네스(ToolRegistry)에 이 서버의 툴을 등록할 때 쓰는 정책 정보.
# 플랫폼 연동 코드(로더·스키마)는 하네스 연동 시점에 다시 만든다. 지금은 서버 실행에 쓰이지 않는다.
# 팀 Gmail 계정 하나를 공용 메일함으로 쓴다. 요청자는 자신이 참여한 메일만 검색·열람할 수 있다.
# risk 는 권한 정책(policy_rule)의 기본 판정을 정할 때 참고하는 제안값이다 (권한 파트와 합의 필요).
schema_version: "1.0"
name: gmail
version: 0.1.0
description: 팀 Gmail 계정 연동 (내 메일 검색 · 읽기, 메일 발송)
owner: connector
endpoint: http://mcp-gmail:8000/mcp
auth_token_env: GMAIL_MCP_TOKEN

tools:
  - name: search_mail
    side_effect: read
    risk: medium            # 메일 본문은 개인·업무 정보를 담을 수 있음
    inject:
      requester_email: email

  - name: read_mail
    side_effect: read
    risk: medium
    inject:
      requester_email: email

  - name: send_mail
    side_effect: write
    risk: high              # 회사 밖으로 나가는 작업 → ASK(사용자 승인) 권장
    inject:
      requester_id: user_id
      requester_email: email
