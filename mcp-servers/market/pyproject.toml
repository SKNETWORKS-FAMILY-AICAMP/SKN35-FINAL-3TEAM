[project]
name = "market-mcp"
version = "0.1.0"
description = "한국은행 ECOS 조회 및 검증된 금리·환율 리포트 MCP"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7", "uvicorn>=0.54.0", "sqlalchemy>=2.0", "asyncpg>=0.29"]

[project.scripts]
market-mcp = "market_mcp.server:main"
market-collect = "market_mcp.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_mcp"]
